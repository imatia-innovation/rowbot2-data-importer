environment:
  profile: staging
logging:
  level:
    com.imatia: DEBUG
    org.springframework.boot.autoconfigure: INFO
management:
  security:
    enabled: false
  server:
    base-path: /
    port: 8081
    servlet:
      context-path: /
  endpoints:
    web:
      base-path: /management
rowbot2-application:
  server:
    protocol: ${ROWBOT2_APPLICATION_SERVER_PROTOCOL}
    host: ${ROWBOT2_APPLICATION_SERVER_HOST}
    port: ${ROWBOT2_APPLICATION_SERVER_PORT}
