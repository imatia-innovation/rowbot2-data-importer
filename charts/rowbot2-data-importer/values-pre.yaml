# This is a YAML-formatted file.

# Deployment configuration
replicaCount: 1
image:
  pullPolicy: IfNotPresent
  ## provided as basic setup. replace as needed
  repository: 179934523585.dkr.ecr.eu-west-3.amazonaws.com/rowbot2-data-importer
  version: pre.0.0.1-SNAPSHOT.26278581761.1
#imagePullSecrets: ["ecr-cred"] # uncomment to use when not aws clusters. Secret will be provided
nameOverride: ""
fullnameOverride: ""

podAnnotations:
  prometheus.io/path: "/management/prometheus"
  prometheus.io/port: "8081"
  prometheus.io/scrape: "true"
# Add labels to the pods
podsLabels: {}
# Add labels to the deployment
deploymentLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
## liveness/readiness probes. standard ontimize endpoints
probePath: /management/health
probePort: 8081
livenessProbe:
  initialDelaySeconds: 40
  failureThreshold: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
  ### Optional distinct liveness probe path, if empty the probePath is used
  probePath: /management/health/liveness
readinessProbe:
  initialDelaySeconds: 40
  failureThreshold: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
  ### Optional distinct readiness probe path, if empty the probePath is used
  probePath: /management/health/readiness
## Adapt resources if needed
resources:
  limits:
    memory: 4096Mi
  requests:
    cpu: 50m
    memory: 4096Mi

jwt:
  enabled: false

## Observability
micrometer:
  metrics:
    tags:
      source: SpringBoot
## Be sure to set API key in secret *******-grafana-api-key, key apiKey if grafana api is used
grafana:
  enabled: true
  server: http://grafana.grafana:80
  datasourceName: Prometheus
  secret: rowbot2-data-importer-grafana-api-key

# Optional configmap. Will be injected as environment variables.
configmap:
  enabled: false
  ## defaults to chart name
  #name:
  #data:
  #  key: "value"
  #  key2: "value2"

# Service configuration. Annotations are used by cert-manager to generate certificates using cluster-issuer
service:
  name: rowbot2-pre-data-importer # a default service name is generated automatically based con install name and app. Customize if needed.
  type: ClusterIP
  externalPort: 80
  internalPort: 8080 # must match your application port
ingress:
  enabled: false
    # annotations:
    #  kubernetes.io/ingress.class: nginx   ## comment to deploy when not in aws clusters
    #  kubernetes.io/tls-acme: "true" ## comment to deploy when not in aws clusters
    #  cert-manager.io/cluster-issuer: cert-manager-letsencrypt-production-route53 # use cert-manager-letsencrypt-staging-route53 for testing environments
    # host: rowbot2-data-importer.dev.imatia.cloud # restricted to *dev.imatia.com by default in development clusters
    #host: rowbot2-data-importer.cloud.imatia.com # uncomment this when not in AWS clusters
  tls:
    #secretName: rowbot2-data-importer-tls # only customize if needed to avoid name conflicts
    enabled: false

# tenant management. The application is a tenant manager.  see deployment.yaml
tenantManagement:
  enabled: false
  # advanced mode. Enables the configuration for organization management
  advanced: false
    # uncomment to give a specific name to the tenant manager secret (if exists won't be created)
    #secret:
    # uncomment to give a specific name to the migration secret (if exists won't be created)
    #migration:
    #secret:
    # uncomment to give a specific name to the notifications email secret (if exists won't be created)
  #notifications:
  #secret:
  # uncomment to give a specific name to the marketplace secret (if exists won't be created). NOTIFICATIONS_EMAIL_HOST is required in configmap.
  marketplace:
    enabled: false
    #url # This is the URL where the Marketplace is hosted
    #secret:

# tenant manager. Location of the Ontimize Tenant Manager if used.  see deployment.yaml
tenantManager:
  enabled: false
  # url: "https://rowbot2-data-importertm.dev.imatia.cloud"
  #authType: secret # Authentication type. Available options: basic, secret
  #uncomment to give a specific name to the tenant manager secret (if exists won't be created)
  #secret:

# Kafka. If used. Will be provided as environment variables to the pods. see deployment.yaml
kafka:
  enabled: false
  # server: "schema-registry-kafka:9092"
  # schemaRegistryUrl: "http://kafka"

# If enabled, data (S3_ACCESS_KEY,S3_SECRET_KEY environment variables) will be provided as environment variables to the pods. see deployment.yaml.
## if enabled, please specify S3_ENDPOINT, S3_BUCKET, S3_REGION in configmap section (as needed)
## (secret must exist.)
s3:
  enabled: false
  #secret: s3-secret # defaults to name+"-s3-secret"

keycloak:
  enabled: false ## if enabled, define KEYCLOAK_*** variables in configmap section.
    # admin: ## if credentials are needed to interact with keycloak admin api. provide them using the secret.
    #enabled: false
  #secret: # defaults to keycloak (usually exists as is created when deploying keycloak). User and password will be injected in KEYCLOAK_USERNAME and KEYCLOAK_PASSWORD env. variables.

storage:
  enabled: true  # enable to create PVC. Customize pvc if required in templates folder
  capacity: 5G
  mountPath: "/opt/rowbot2-data-importer/"

jvmOptions: "-Xmx3g -Xms512m"  ## adjust according to pod requests

importers:
  page_size: 20000

retries:
  default:
    max_attempts: 100
    ms_to_retry: 300000

